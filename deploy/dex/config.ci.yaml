# The identity provider of the interoperability tests (dex).
#
# The issuer has to be reachable from the gateway and from the test, so it
# is the loopback address. The redirect uri is the one of the gateway of the
# interop test: the test uses a fixed port, so the uri is exact.
#
#   docker run --rm -p 5556:5556 -v "$PWD/deploy/dex/config.ci.yaml:/etc/dex/config.yaml:ro" \
#     ghcr.io/dexidp/dex:v25.0.0 dex serve /etc/dex/config.yaml
#
# The password of the account is "alice-password".

issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556
  allowedOrigins:
    - http://localhost:5556

oauth2:
  skipApprovalScreen: true
  responseTypes: ["code"]

staticClients:
  - id: shuttle-ci
    name: Shuttle (the interoperability tests)
    secret: shuttle-ci-secret
    redirectURIs:
      - http://localhost:18080/auth/callback
    grantTypes:
      - authorization_code
    scope: "openid profile email groups"

enablePasswordDB: true

staticPasswords:
  # alice-password
  - email: "alice@shuttle.test"
    hash: "$2b$10$gEA7hVgukxofrG2cCZodGeXF/ChngFBnJGQT5DZ/yDiFsWFns5ADS"
    username: "alice"
    userID: "08a8689b-dbdb-4b9d-b6f1-c4e5a1a1b0a1"
