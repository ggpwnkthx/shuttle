# Development identity provider (dex).
#
# The issuer has to be reachable from the browser *and* from the gateway, so
# the stack uses the `dex.local` name: add `127.0.0.1 dex.local` to your
# /etc/hosts and compose resolves the same name inside the network.
issuer: http://dex.local:5556/dex

storage:
  type: sqlite3
  config:
    file: /data/dex.db

web:
  http: 0.0.0.0:5556
  allowedOrigins:
    - http://dex.local:5556

oauth2:
  skipApprovalScreen: true
  responseTypes: ["code"]

staticClients:
  - id: shuttle
    name: Shuttle
    secret: shuttle-secret
    redirectURIs:
      - http://localhost:8080/auth/callback
    grantTypes:
      - authorization_code
      - refresh_token
    scope: "openid profile email groups"

enablePasswordDB: true

staticPasswords:
  # alice-password
  - email: "alice@shuttle.test"
    hash: "$2b$10$gEA7hVgukxofrG2cCZodGeXF/ChngFBnJGQT5DZ/yDiFsWFns5ADS"
    username: "alice"
    userID: "08a8689b-dbdb-4b9d-b6f1-c4e5a1a1b0a1"
  # bob-password
