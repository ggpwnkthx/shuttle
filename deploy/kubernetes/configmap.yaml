apiVersion: v1
kind: ConfigMap
metadata:
  name: shuttle-routes
  labels:
    app.kubernetes.io/name: shuttle
    app.kubernetes.io/component: gateway
# The route table of the deployment. It is mounted read-only: the gateway
# watches it and reloads it when it changes, it never writes it.
#
# The file trusts no range: the ranges of the proxies are in the
# environment of the deployment (`SHUTTLE_TRUSTED_PROXIES`), and the
# environment replaces the ranges of the file.
#
# The upstream of a route is a name of the service of the application, in
# the same namespace. A route may not carry a query string and it may not
# carry a fragment.
data:
  routes.json: |
    {
      "version": 1,
      "defaults": {
        "auth": { "mode": "none" },
        "timeouts": { "responseMs": 5000, "firstByteMs": 30000, "bodyMs": 300000 },
        "maxBodyBytes": 10485760
      },
      "trustedProxies": [],
      "reservedPaths": [],
      "routes": [
        {
          "id": "public-site",
          "match": { "host": "app.example.com", "path": "/" },
          "upstream": "http://upstream-a.platform.svc.cluster.local:3000",
          "auth": { "mode": "none" }
        },
        {
          "id": "workspace-api",
          "match": { "host": "api.example.com", "path": "/ws/{workspaceId}/" },
          "upstream": "http://upstream-b.platform.svc.cluster.local:3000",
          "auth": { "mode": "any", "workspace": { "param": "workspaceId", "requireUuid": true } },
          "websocket": true,
          "maxBodyBytes": 5242880
        }
      ]
    }
