# The template of the secret of the deployment.
#
# The real secret does NOT live in the repository and it does not live in
# this file: it is created in the secret store of the platform and applied
# with the sealed secrets, the external secrets operator or the equivalent
# of the platform.
#
#   kubectl create secret generic shuttle-secrets \
#     --from-literal=SHUTTLE_SESSION_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=SHUTTLE_OIDC_CLIENT_SECRET=... \
#     --from-literal=SHUTTLE_ACCESS_TOKEN=... \
#     --from-literal=SHUTTLE_METRICS_TOKEN=...
#
# The names of the keys are the names of the variables of the gateway: the
# deployment reads them from the environment.
apiVersion: v1
kind: Secret
metadata:
  name: shuttle-secrets
  labels:
    app.kubernetes.io/name: shuttle
    app.kubernetes.io/component: gateway
type: Opaque
stringData:
  # The secret that signs the state of the login and that derives the key of
  # the signature of the identity. It has to be the same on every replica.
  SHUTTLE_SESSION_SECRET: "replace-me-with-32-random-bytes"
  SHUTTLE_OIDC_CLIENT_SECRET: "replace-me"
  SHUTTLE_ACCESS_TOKEN: "replace-me"
  SHUTTLE_METRICS_TOKEN: "replace-me"
  # The url of the shared state. The password belongs in the secret store.
  SHUTTLE_SESSION_URL: "rediss://:replace-me@redis.platform.svc.cluster.local:6379/0"
  SHUTTLE_SHARED_STATE_URL: "rediss://:replace-me@redis.platform.svc.cluster.local:6379/1"
