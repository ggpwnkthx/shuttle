# The production stack of Shuttle: the gateway and the shared state.
#
# The fixtures of the development stack (the identity provider, the access
# service, the sample upstreams) are NOT here: a deployment brings its own.
#
#   docker compose -f deploy/compose.production.yaml up -d
#
# The secrets come from the environment of the shell (a secret store, a
# vault agent, the secrets of the orchestrator). The file below holds no
# credential: the values that are not set make the gateway refuse to start,
# exactly like in a production deployment.
name: shuttle

services:
  gateway:
    image: ghcr.io/ggpwnkthx/shuttle:1.3.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SHUTTLE_CONFIG: /etc/shuttle/routes.json
      SHUTTLE_GATEWAY_HOST: 0.0.0.0
      SHUTTLE_GATEWAY_PORT: "8080"
      SHUTTLE_OIDC_ISSUER: ${SHUTTLE_OIDC_ISSUER:?the issuer of the identity provider is required}
      SHUTTLE_OIDC_CLIENT_ID: ${SHUTTLE_OIDC_CLIENT_ID:-shuttle}
      SHUTTLE_OIDC_CLIENT_SECRET: ${SHUTTLE_OIDC_CLIENT_SECRET:?the secret of the client is required}
      SHUTTLE_OIDC_REDIRECT_URI: ${SHUTTLE_OIDC_REDIRECT_URI:?the url of the callback is required}
      SHUTTLE_ACCESS_URL: ${SHUTTLE_ACCESS_URL:?the access service is required}
      SHUTTLE_ACCESS_TOKEN: ${SHUTTLE_ACCESS_TOKEN:?the token of the access service is required}
      # The secret of the sessions: it signs the state of the login.
      SHUTTLE_SESSION_SECRET: ${SHUTTLE_SESSION_SECRET:?the secret of the sessions is required}
      # The private key that signs the identity of the requests. The
      # upstreams are given the public key of it, so an upstream that
      # verifies an identity cannot mint one. `bun run identity:key`
      # generates a pair.
      SHUTTLE_IDENTITY_SIGNING_KEY: ${SHUTTLE_IDENTITY_SIGNING_KEY:?the key of the identity signature is required}
      # The shared state lives in a Redis server. A deployment that runs on
      # a database it already has points these two urls at a Postgres
      # server instead:
      #
      #   SHUTTLE_SESSION_URL: postgres://user:password@postgres:5432/shuttle
      #   SHUTTLE_SHARED_STATE_URL: postgres://user:password@postgres:5432/shuttle
      #
      # The two backends hold the same state with the same contract, and
      # `bun run benchmark` measures them side by side.
      SHUTTLE_SESSION_URL: redis://redis:6379/0
      SHUTTLE_SHARED_STATE_URL: redis://redis:6379/1
      SHUTTLE_METRICS_TOKEN: ${SHUTTLE_METRICS_TOKEN:?the token of the metrics is required}
      # At least one rate limit has to be set: the gateway refuses to start
      # in production without one, unless SHUTTLE_ALLOW_NO_RATE_LIMITS=true.
      SHUTTLE_RATE_LIMIT_TOTAL_MAX: ${SHUTTLE_RATE_LIMIT_TOTAL_MAX:-1000}
      SHUTTLE_RATE_LIMIT_GLOBAL_MAX: ${SHUTTLE_RATE_LIMIT_GLOBAL_MAX:-600}
      SHUTTLE_RATE_LIMIT_MAX: ${SHUTTLE_RATE_LIMIT_MAX:-600}
      SHUTTLE_RATE_LIMIT_PRINCIPAL_MAX: ${SHUTTLE_RATE_LIMIT_PRINCIPAL_MAX:-300}
      SHUTTLE_EXTERNAL_PROTO: https
      SHUTTLE_COOKIE_SECURE: "true"
      SHUTTLE_TRUSTED_PROXIES: ${SHUTTLE_TRUSTED_PROXIES:-}
      SHUTTLE_LOG_LEVEL: ${SHUTTLE_LOG_LEVEL:-info}
      SHUTTLE_SHUTDOWN_TIMEOUT_MS: "15000"
    volumes:
      - ../config/routes.json:/etc/shuttle/routes.json:ro
    depends_on:
      redis:
        condition: service_healthy
    # The gateway closes its websockets and lets the requests that are in
    # flight finish: the grace period is longer than its own deadline.
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  # The control plane is the administrative surface of the deployment. It is
  # a separate process, it listens on its own socket and it acts on the
  # shared state directly. The gateway exposes no administrative endpoint.
  #
  # It is internal: the port is not published, and the service is reached
  # over the network of the deployment. The map of the tokens is a secret:
  # it is mounted from a file that only the control plane reads.
  control:
    image: ghcr.io/ggpwnkthx/shuttle:1.3.0
    restart: unless-stopped
    command: ["bun", "run", "src/control-main.ts"]
    environment:
      # The control plane binds the loopback address by default. It is
      # reached over the network of the deployment: the address is the one
      # of the service.
      SHUTTLE_CONTROL_HOST: 0.0.0.0
      SHUTTLE_CONTROL_PORT: "9090"
      # The map of the tokens: {token: {operator, scope}}. The scopes are
      # read, operate and config. The map is mounted as a file, and it is
      # never the secret of something else.
      SHUTTLE_CONTROL_TOKENS_FILE: /etc/shuttle/control-tokens.json
      # The shared state the control plane acts on: the sessions, the
      # cached decisions and the route table. It is the state of the
      # sessions of the gateway (the database 0), and it is reached with
      # the credentials of the control plane, which may write the route
      # table and the trail of the writes.
      SHUTTLE_CONTROL_STATE_URL: ${SHUTTLE_CONTROL_STATE_URL:-redis://redis:6379/0}
      SHUTTLE_CONTROL_KEY_PREFIX: shuttle
      SHUTTLE_CONTROL_SHARED_STATE_KEY_PREFIX: shuttle
      SHUTTLE_LOG_LEVEL: ${SHUTTLE_LOG_LEVEL:-info}
    volumes:
      # The example of the map. A deployment replaces it with its own map,
      # and the map of the tokens is a secret.
      - ./control-tokens.example.json:/etc/shuttle/control-tokens.json:ro
    expose:
      - "9090"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:9090/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --maxmemory-policy
      - volatile-ttl
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # The other backend of the shared state. It is not started by default: a
  # deployment brings its own database, and this one is here for a stack
  # that measures the two backends side by side.
  #
  #   docker compose -f deploy/compose.production.yaml --profile postgres up -d
  #
  # and the gateway reads:
  #
  #   SHUTTLE_SESSION_URL=postgres://postgres:postgres@postgres:5432/shuttle
  #   SHUTTLE_SHARED_STATE_URL=postgres://postgres:postgres@postgres:5432/shuttle
  postgres:
    # The version of the server of a deployment is the choice of the
    # deployment: the gateway is built and tested against PostgreSQL 18
    # and does not refuse an older server. This reference stack stays on
    # the version it was on.
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shuttle
      # The schema of the shared state is built by the gateway itself when
      # it connects. A deployment that applies its own migrations sets
      # SHUTTLE_POSTGRES_AUTO_MIGRATE=false and runs the migration script.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shuttle"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
  postgres-data:
