name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The version of the runtime the gateway is built and released with.
  BUN_VERSION: '1.4.3'
jobs:
  check:
    name: types, lint, format and tests
    runs-on: ubuntu-latest
    env:
      # The runtime of the release. The 1.2 line of the runtime does not
      # expose the boundaries the specification relies on, the measurements
      # are in docs/runtime.md.
      BUN_VERSION: '1.4.3'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: install
        run: bun install --frozen-lockfile

      - name: types
        run: bun run typecheck

      - name: lint
        run: bun run lint

      - name: format
        run: bun run format:check

      - name: import boundaries
        run: bun test test/architecture

      - name: the dead code
        run: bun run dead

      - name: the versions of the project agree
        run: bun run versions

      - name: the environment and its documentation agree
        run: bun run environment

      - name: unit and contract tests
        run: bun test src test/contract

      - name: the property tests of the parsers
        run: bun test test/fuzz

      - name: network tests
        run: bun test test/network

      - name: the soak
        run: bun test test/load

  redis:
    name: the shared state against a real redis
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: install
        run: bun install --frozen-lockfile

      - name: the atomic operations of the shared state
        run: bun test test/integration
        env:
          SHUTTLE_TEST_REDIS_URL: redis://127.0.0.1:6379/0

  postgres:
    name: the shared state against a real postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        # The version of the server of the tests is the version the gateway
        # is built and tested against (PostgreSQL 18). A deployment is not
        # bound to it: the gateway does not refuse an older server.
        image: postgres:18-alpine
        ports:
          - '5432:5432'
        env:
          POSTGRES_PASSWORD: shuttle
          POSTGRES_DB: shuttle
        options: >-
          --health-cmd "pg_isready -U postgres -d shuttle"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: install
        run: bun install --frozen-lockfile

      - name: the atomic operations of the shared state
        run: bun test test/integration
        env:
          SHUTTLE_TEST_POSTGRES_URL: postgres://postgres:shuttle@127.0.0.1:5432/shuttle

      - name: the migration of the schema
        run: bun run postgres:migrate -- postgres://postgres:shuttle@127.0.0.1:5432/shuttle
        env:
          SHUTTLE_TEST_POSTGRES_URL: postgres://postgres:shuttle@127.0.0.1:5432/shuttle

  interop:
    name: the interoperability with a real identity provider
    runs-on: ubuntu-latest
    # The job gates the release: the gateway authenticates the callers
    # against a provider of the deployment, and a change that breaks the
    # flow against a real provider is a change that breaks the deployment
    # of every user of the gateway. It became blocking when the flow
    # against dex was proven; it stays blocking from now on.
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: install
        run: bun install --frozen-lockfile

      - name: start the provider
        run: |
          # The version of the provider is pinned: a provider that changes
          # the way it names the subject of a caller, or the shape of its
          # login form, changes what the test proves.
          docker run -d --rm --name dex -p 5556:5556 \
            -v "$GITHUB_WORKSPACE/deploy/dex/config.ci.yaml:/etc/dex/config.yaml:ro" \
            ghcr.io/dexidp/dex:v2.46.1 dex serve /etc/dex/config.yaml
          for attempt in $(seq 1 30); do
            if wget -qO- http://127.0.0.1:5556/dex/.well-known/openid-configuration > /dev/null; then
              echo "the provider is up"
              exit 0
            fi
            sleep 1
          done
          echo "the provider did not start"
          docker logs dex
          exit 1

      - name: the flow against a real provider
        run: bun test test/interop
        env:
          SHUTTLE_TEST_DEX_ISSUER: http://localhost:5556/dex
          SHUTTLE_TEST_DEX_CLIENT_ID: shuttle-ci
          SHUTTLE_TEST_DEX_CLIENT_SECRET: shuttle-ci-secret
          SHUTTLE_TEST_DEX_EMAIL: alice@shuttle.test
          SHUTTLE_TEST_DEX_PASSWORD: alice-password

  load:
    name: the capacity of the gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: install
        run: bun install --frozen-lockfile

      - name: measure
        run: bun run load -- --requests 20000 --concurrency 100

      - name: the websockets
        run: bun run load -- --websockets 500

  browser:
    name: the browser behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: install
        run: bun install --frozen-lockfile

      - name: install the browser
        run: bunx playwright install --with-deps chromium

      - name: the cookies and the origins
        run: bun test test/browser

  image:
    name: the production image
    runs-on: ubuntu-latest
    services:
      # The state of a production deployment is shared: the image is
      # started against a real Redis, the way a deployment runs.
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: docker build -f Dockerfile -t shuttle:ci .

      - name: the key of the identity signature
        run: |
          # The private key that signs the identity of the requests. The
          # upstreams are given the public key of it, and a production
          # deployment has to set it: the gateway refuses to start
          # without one.
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 \
            -out "$RUNNER_TEMP/identity-key.pem"
          {
            echo "SHUTTLE_IDENTITY_SIGNING_KEY<<EOF"
            cat "$RUNNER_TEMP/identity-key.pem"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: the image starts with the configuration of a deployment
        run: |
          # The state of the deployment is shared: the image reaches the
          # Redis of the job through the host of the runner.
          docker run -d --name shuttle -p 8080:8080 \
            --add-host host.docker.internal:host-gateway \
            -e SHUTTLE_SESSION_SECRET=ci-secret \
            -e SHUTTLE_IDENTITY_SIGNING_KEY \
            -e SHUTTLE_OIDC_ISSUER=https://dex.example.com/dex \
            -e SHUTTLE_OIDC_CLIENT_ID=shuttle \
            -e SHUTTLE_OIDC_CLIENT_SECRET=ci-client-secret \
            -e SHUTTLE_OIDC_REDIRECT_URI=https://shuttle.example.com/auth/callback \
            -e SHUTTLE_ACCESS_URL=https://access.example.com \
            -e SHUTTLE_ACCESS_TOKEN=ci-access-token \
            -e SHUTTLE_RATE_LIMIT_TOTAL_MAX=1000 \
            -e SHUTTLE_SESSION_URL=redis://host.docker.internal:6379/0 \
            -e SHUTTLE_SHARED_STATE_URL=redis://host.docker.internal:6379/1 \
            -v "$PWD/config/routes.json:/etc/shuttle/routes.json:ro" \
            shuttle:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              echo "the gateway is healthy"
              break
            fi
            sleep 1
          done
          # The readiness of the gateway needs the shared state: the image
          # is ready only when the sessions of the callers can be stored.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/readyz > /dev/null; then
              echo "the gateway is ready"
              exit 0
            fi
            sleep 1
          done
          docker logs shuttle
          exit 1

      - name: the image refuses to start without a session secret
        run: |
          # The state is shared: the only thing missing here is the secret.
          if docker run --rm \
            -e SHUTTLE_SESSION_URL=redis://127.0.0.1:6379/0 \
            -e SHUTTLE_SHARED_STATE_URL=redis://127.0.0.1:6379/1 \
            shuttle:ci; then
            echo "the gateway started without a session secret"
            exit 1
          fi

      - name: the image refuses to start without an access service
        run: |
          if docker run --rm \
            -e SHUTTLE_SESSION_SECRET=ci-secret \
            -e SHUTTLE_IDENTITY_SIGNING_KEY \
            -e SHUTTLE_OIDC_ISSUER=https://dex.example.com/dex \
            -e SHUTTLE_OIDC_CLIENT_ID=shuttle \
            -e SHUTTLE_OIDC_CLIENT_SECRET=ci-client-secret \
            -e SHUTTLE_OIDC_REDIRECT_URI=https://shuttle.example.com/auth/callback \
            -e SHUTTLE_ACCESS_URL=https://access.example.com \
            -e SHUTTLE_RATE_LIMIT_TOTAL_MAX=1000 \
            -e SHUTTLE_SESSION_URL=redis://127.0.0.1:6379/0 \
            -e SHUTTLE_SHARED_STATE_URL=redis://127.0.0.1:6379/1 \
            shuttle:ci; then
            echo "the gateway started without a token for the access service"
            exit 1
          fi

      - name: the image refuses to start without an identity provider
        run: |
          if docker run --rm \
            -e SHUTTLE_SESSION_SECRET=ci-secret \
            -e SHUTTLE_IDENTITY_SIGNING_KEY \
            -e SHUTTLE_ACCESS_URL=https://access.example.com \
            -e SHUTTLE_ACCESS_TOKEN=ci-access-token \
            -e SHUTTLE_RATE_LIMIT_TOTAL_MAX=1000 \
            -e SHUTTLE_SESSION_URL=redis://127.0.0.1:6379/0 \
            -e SHUTTLE_SHARED_STATE_URL=redis://127.0.0.1:6379/1 \
            shuttle:ci; then
            echo "the gateway started without an identity provider"
            exit 1
          fi

      - name: the image refuses to start without a rate limit
        run: |
          if docker run --rm \
            -e SHUTTLE_SESSION_SECRET=ci-secret \
            -e SHUTTLE_IDENTITY_SIGNING_KEY \
            -e SHUTTLE_OIDC_ISSUER=https://dex.example.com/dex \
            -e SHUTTLE_OIDC_CLIENT_ID=shuttle \
            -e SHUTTLE_OIDC_CLIENT_SECRET=ci-client-secret \
            -e SHUTTLE_OIDC_REDIRECT_URI=https://shuttle.example.com/auth/callback \
            -e SHUTTLE_ACCESS_URL=https://access.example.com \
            -e SHUTTLE_ACCESS_TOKEN=ci-access-token \
            -e SHUTTLE_SESSION_URL=redis://127.0.0.1:6379/0 \
            -e SHUTTLE_SHARED_STATE_URL=redis://127.0.0.1:6379/1 \
            shuttle:ci; then
            echo "the gateway started without a rate limit"
            exit 1
          fi

      - name: the image refuses to start without the key of the identity signature
        run: |
          # The signature of the identity is asymmetric in a production
          # deployment: the gateway holds the private key and the upstreams
          # hold the public one, so an upstream that verifies an identity
          # cannot mint one.
          if docker run --rm \
            -e SHUTTLE_SESSION_SECRET=ci-secret \
            -e SHUTTLE_OIDC_ISSUER=https://dex.example.com/dex \
            -e SHUTTLE_OIDC_CLIENT_ID=shuttle \
            -e SHUTTLE_OIDC_CLIENT_SECRET=ci-client-secret \
            -e SHUTTLE_OIDC_REDIRECT_URI=https://shuttle.example.com/auth/callback \
            -e SHUTTLE_ACCESS_URL=https://access.example.com \
            -e SHUTTLE_ACCESS_TOKEN=ci-access-token \
            -e SHUTTLE_RATE_LIMIT_TOTAL_MAX=1000 \
            -e SHUTTLE_SESSION_URL=redis://127.0.0.1:6379/0 \
            -e SHUTTLE_SHARED_STATE_URL=redis://127.0.0.1:6379/1 \
            shuttle:ci; then
            echo "the gateway started without the key of the identity signature"
            exit 1
          fi

      - name: the image refuses to start with the state in the process
        run: |
          if docker run --rm \
            -e SHUTTLE_SESSION_SECRET=ci-secret \
            -e SHUTTLE_IDENTITY_SIGNING_KEY \
            -e SHUTTLE_OIDC_ISSUER=https://dex.example.com/dex \
            -e SHUTTLE_OIDC_CLIENT_ID=shuttle \
            -e SHUTTLE_OIDC_CLIENT_SECRET=ci-client-secret \
            -e SHUTTLE_OIDC_REDIRECT_URI=https://shuttle.example.com/auth/callback \
            -e SHUTTLE_ACCESS_URL=https://access.example.com \
            -e SHUTTLE_ACCESS_TOKEN=ci-access-token \
            -e SHUTTLE_RATE_LIMIT_TOTAL_MAX=1000 \
            shuttle:ci; then
            echo "the gateway started with the state of the deployment in the process"
            exit 1
          fi

      - name: the fixtures are not part of the image
        run: |
          if docker run --rm --entrypoint sh shuttle:ci -c 'ls services'; then
            echo "the fixtures are part of the production image"
            exit 1
          fi

      - name: the stage of the fixtures builds
        run: |
          # The fixtures need the development dependencies: the stage is
          # built apart, so a mistake in it is a failing build and not a
          # broken development stack.
          docker build -f Dockerfile --target fixtures -t shuttle-fixtures:ci .
          docker run --rm --entrypoint sh shuttle-fixtures:ci -c 'ls node_modules/oidc-provider'
