name: release

# The release of the image.
#
# The workflow runs on a tag: it checks that the tag names the version of
# the package, it builds the image of the release, it starts it with the
# configuration of a deployment, it publishes it to the registry and it
# exports it as an artifact of the run.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The image is published with two tags: the tag of the release (`v0.2.0`)
# and the version itself (`0.2.0`). The manifests of the deployment name
# the second one, so a deployment that pins a version pins the image of
# that release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # The image is published to the registry of the repository.
  packages: write

env:
  # The version of the runtime the gateway is built and released with.
  BUN_VERSION: '1.4.3'

jobs:
  image:
    name: the image of the release
    runs-on: ubuntu-latest
    services:
      # The state of a production deployment is shared: the image of the
      # release is started against a real Redis, the way a deployment runs.
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The outputs of this step are the tag and the version of the
      # release. They are written by the **same** step: an output that is
      # written by another step of the job is not readable here, the
      # expression is empty, and the build of the image fails with an
      # empty tag.
      - name: the version of the release
        id: version
        run: |
          expected=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$expected" ]; then
            echo "the tag $GITHUB_REF_NAME does not name the version $expected of the package"
            exit 1
          fi
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=$expected" >> "$GITHUB_OUTPUT"

      - name: the version of the release is known
        run: |
          if [ -z "${{ steps.version.outputs.tag }}" ] || [ -z "${{ steps.version.outputs.version }}" ]; then
            echo "the version of the release is empty: the step that computes it did not write its outputs"
            exit 1
          fi
          echo "the release is ${{ steps.version.outputs.tag }} (${{ steps.version.outputs.version }})"

      - name: the versions of the project agree
        run: bun run versions

      - uses: docker/setup-buildx-action@v3

      - name: the login in the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: |
            ghcr.io/ggpwnkthx/shuttle:${{ steps.version.outputs.tag }}
            ghcr.io/ggpwnkthx/shuttle:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          # The attestations are added when the image is published: the
          # docker exporter of a local build cannot carry a manifest list,
          # and an attestation is one.
          provenance: false
          sbom: false

      - name: the image starts with the configuration of a deployment
        run: |
          # The state of the deployment is shared: the image reaches the
          # Redis of the job through the host of the runner.
          docker run -d --name shuttle -p 8080:8080 \
            --add-host host.docker.internal:host-gateway \
            -e SHUTTLE_SESSION_SECRET=release-secret \
            -e SHUTTLE_OIDC_ISSUER=https://dex.example.com/dex \
            -e SHUTTLE_OIDC_CLIENT_ID=shuttle \
            -e SHUTTLE_OIDC_CLIENT_SECRET=release-client-secret \
            -e SHUTTLE_OIDC_REDIRECT_URI=https://shuttle.example.com/auth/callback \
            -e SHUTTLE_ACCESS_URL=https://access.example.com \
            -e SHUTTLE_ACCESS_TOKEN=release-access-token \
            -e SHUTTLE_METRICS_TOKEN=release-metrics-token \
            -e SHUTTLE_RATE_LIMIT_TOTAL_MAX=1000 \
            -e SHUTTLE_SESSION_URL=redis://host.docker.internal:6379/0 \
            -e SHUTTLE_SHARED_STATE_URL=redis://host.docker.internal:6379/1 \
            -v "$PWD/config/routes.json:/etc/shuttle/routes.json:ro" \
            "ghcr.io/ggpwnkthx/shuttle:${{ steps.version.outputs.tag }}"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              echo "the gateway is healthy"
              curl -fsS http://127.0.0.1:8080/healthz
              echo
              break
            fi
            sleep 1
          done
          # The readiness of the gateway needs the shared state: the image
          # is ready only when the sessions of the callers can be stored.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/readyz > /dev/null; then
              echo "the gateway is ready"
              exit 0
            fi
            sleep 1
          done
          docker logs shuttle
          exit 1

      - name: the image refuses to start without the secret of the sessions
        run: |
          if docker run --rm \
            -e SHUTTLE_OIDC_ISSUER=https://dex.example.com/dex \
            -e SHUTTLE_OIDC_CLIENT_ID=shuttle \
            -e SHUTTLE_OIDC_CLIENT_SECRET=release-client-secret \
            -e SHUTTLE_OIDC_REDIRECT_URI=https://shuttle.example.com/auth/callback \
            -e SHUTTLE_ACCESS_URL=https://access.example.com \
            -e SHUTTLE_ACCESS_TOKEN=release-access-token \
            "ghcr.io/ggpwnkthx/shuttle:${{ steps.version.outputs.tag }}"; then
            echo "the gateway started without the secret of the sessions"
            exit 1
          fi

      - name: the image refuses to start with the state in the process
        run: |
          if docker run --rm \
            -e SHUTTLE_SESSION_SECRET=release-secret \
            -e SHUTTLE_OIDC_ISSUER=https://dex.example.com/dex \
            -e SHUTTLE_OIDC_CLIENT_ID=shuttle \
            -e SHUTTLE_OIDC_CLIENT_SECRET=release-client-secret \
            -e SHUTTLE_OIDC_REDIRECT_URI=https://shuttle.example.com/auth/callback \
            -e SHUTTLE_ACCESS_URL=https://access.example.com \
            -e SHUTTLE_ACCESS_TOKEN=release-access-token \
            -e SHUTTLE_RATE_LIMIT_TOTAL_MAX=1000 \
            "ghcr.io/ggpwnkthx/shuttle:${{ steps.version.outputs.tag }}"; then
            echo "the gateway started with the state of the deployment in the process"
            exit 1
          fi

      - name: publish the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/ggpwnkthx/shuttle:${{ steps.version.outputs.tag }}
            ghcr.io/ggpwnkthx/shuttle:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          # The provenance of the image: what was built and from what.
          # The registry carries the attestations, the local build cannot:
          # the docker exporter does not support the manifest list of an
          # attestation.
          provenance: true
          sbom: true

      - name: export the image
        run: |
          docker save "ghcr.io/ggpwnkthx/shuttle:${{ steps.version.outputs.tag }}" \
            | gzip > shuttle-${{ steps.version.outputs.tag }}.tar.gz
          # The digest of the image: it is what a deployment pins.
          docker image inspect "ghcr.io/ggpwnkthx/shuttle:${{ steps.version.outputs.tag }}" \
            --format '{{index .RepoDigests 0}}' || true

      - uses: actions/upload-artifact@v4
        with:
          name: shuttle-image-${{ steps.version.outputs.tag }}
          path: shuttle-${{ steps.version.outputs.tag }}.tar.gz
          retention-days: 30
